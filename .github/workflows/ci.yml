name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Run TypeScript tests
        run: pnpm test:ts
      - name: Build web app
        run: pnpm build:web

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y                     libgtk-3-dev                     libwebkit2gtk-4.1-dev                     libayatana-appindicator3-dev                     librsvg2-dev                     patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run clippy
        run: pnpm lint:rust
      - name: Run Rust tests
        run: pnpm test:rust

  native-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime-only preset
        run: cmake --preset runtime-only
      - name: Build runtime-only preset
        run: cmake --build --preset runtime-only
      - name: Run runtime-only tests
        run: ctest --preset runtime-only

  clang-analyzer:
    runs-on: ubuntu-latest
    env:
      LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
      Clang_DIR: /usr/lib/llvm-18/lib/cmake/clang
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev libclang-18-dev
      - name: Configure dev preset
        run: cmake --preset dev
      - name: Build dev preset
        run: cmake --build --preset dev
      - name: Run native tests
        run: ctest --preset dev
      - name: Analyze sample
        run: |
          ./build/dev/native/clang-tool/algoviz-analyzer samples/arrays/selection-sort.cpp -- -std=c++20 | tee /tmp/algoviz-analysis.json
          grep -q '"name":"values"' /tmp/algoviz-analysis.json
